<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Advanced PDF OCR Formatter</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Tesseract -->
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- FileSaver -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<!-- DOCX -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:1200px;
background:#1e293b;
padding:30px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:34px;
}

.upload-box{
border:2px dashed #475569;
padding:40px;
border-radius:14px;
background:#111827;
text-align:center;
margin-bottom:20px;
}

input,
button,
textarea{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

input{
background:#0f172a;
color:white;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1d4ed8;
}

textarea{
height:500px;
background:#0f172a;
color:white;
resize:none;
line-height:1.8;
white-space:pre-wrap;
font-family:Consolas,monospace;
}

.page-box{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
margin-top:15px;
}

.download-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.progress{
width:100%;
height:14px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.progress-bar{
width:0%;
height:100%;
background:#22c55e;
transition:0.3s;
}

.status{
margin-top:15px;
text-align:center;
color:#93c5fd;
font-size:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Advanced PDF OCR Formatter</h1>

<div class="upload-box">

<p>Upload PDF File</p>

<input
type="file"
id="pdfFile"
accept="application/pdf">

</div>

<div class="page-box">

<input
type="number"
id="fromPage"
placeholder="From Page">

<input
type="number"
id="toPage"
placeholder="To Page">

<button id="extractBtn">
Extract Pages
</button>

</div>

<div class="download-buttons">

<button id="downloadTxtBtn">
Download TXT
</button>

<button id="downloadDocBtn">
Download DOCX
</button>

</div>

<div class="status"
id="status"></div>

<div class="progress">
<div class="progress-bar"
id="progressBar"></div>
</div>

<textarea
id="outputText"
placeholder="Formatted extracted text..."
></textarea>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let extractedText = "";

let formattedContent = [];

let originalFileName = "document";

// OCR fallback language
const languagePack =
"eng+urd+ara+hin";

// EXTRACT BUTTON
$("#extractBtn").click(async function(){

const file =
$("#pdfFile")[0].files[0];

if(!file){

alert("Please upload PDF.");

return;

}

originalFileName =
file.name.replace(/\.pdf$/i,'');

$("#status").text(
"Loading PDF..."
);

$("#progressBar").css(
"width",
"0%"
);

extractedText = "";

formattedContent = [];

$("#outputText").val("");

const reader = new FileReader();

reader.onload = async function(){

try{

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib.getDocument(
typedarray
).promise;

const totalPages =
pdf.numPages;

const startPage =
parseInt($("#fromPage").val()) || 1;

const endPage =
parseInt($("#toPage").val()) || totalPages;

for(
let pageNum = startPage;
pageNum <= endPage;
pageNum++
){

$("#status").text(
"Extracting page " +
pageNum
);

const page =
await pdf.getPage(pageNum);

const textContent =
await page.getTextContent();

extractedText +=

"\n\n====================================================\n";

extractedText +=
"PAGE " + pageNum + "\n";

extractedText +=
"====================================================\n\n";

formattedContent.push({

type:"heading",

text:"PAGE " + pageNum

});

let lastY = null;

if(textContent.items.length > 0){

for(const item of textContent.items){

const text =
item.str;

if(!text.trim()){
continue;
}

const fontName =
item.fontName || "";

const lowerFont =
fontName.toLowerCase();

const transform =
item.transform;

const fontSize =
Math.round(
Math.abs(transform[0])
);

const y =
transform[5];

// BETTER BOLD DETECTION
const isBold =

lowerFont.includes("bold")
||
lowerFont.includes("black")
||
lowerFont.includes("heavy")
||
lowerFont.includes("semibold")
||
lowerFont.includes("demi")
||
lowerFont.includes("medium")
||
lowerFont.includes("extrabold")
||
lowerFont.includes("extrablack");

// FONT FAMILY DETECTION
let fontFamily = "Arial";

if(lowerFont.includes("times")){

fontFamily =
"Times New Roman";

}
else if(lowerFont.includes("courier")){

fontFamily =
"Courier New";

}
else if(lowerFont.includes("calibri")){

fontFamily =
"Calibri";

}
else if(lowerFont.includes("cambria")){

fontFamily =
"Cambria";

}
else if(lowerFont.includes("helvetica")){

fontFamily =
"Helvetica";

}

if(
lastY !== null
&&
Math.abs(y - lastY) > 15
){

extractedText += "\n";

formattedContent.push({
type:"newline"
});

}

lastY = y;

extractedText +=
text + " ";

formattedContent.push({

type:"text",

text:text,

bold:isBold,

size:fontSize,

font:fontFamily

});

}

}
else{

// OCR FALLBACK
const viewport =
page.getViewport({
scale:4
});

const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");

canvas.width =
viewport.width;

canvas.height =
viewport.height;

await page.render({

canvasContext:context,
viewport:viewport

}).promise;

const imageData =
canvas.toDataURL("image/png");

const result =
await Tesseract.recognize(
imageData,
languagePack
);

const ocrText =
result.data.text;

extractedText += ocrText;

formattedContent.push({

type:"text",

text:ocrText,

bold:false,

size:12,

font:"Arial"

});

}

extractedText += "\n\n";

$("#outputText").val(
extractedText
);

const progress =
(
(pageNum - startPage + 1)
/
(endPage - startPage + 1)
)
* 100;

$("#progressBar").css(
"width",
progress + "%"
);

}

$("#status").text(
"Extraction completed successfully."
);

}catch(error){

console.error(error);

alert(
"Error extracting PDF."
);

}

};

reader.readAsArrayBuffer(file);

});

// DOWNLOAD TXT
$("#downloadTxtBtn").click(function(){

if(!extractedText){

alert(
"No extracted text available."
);

return;

}

const blob =
new Blob(

[extractedText],

{
type:
"text/plain;charset=utf-8"
}

);

saveAs(
blob,
originalFileName + "_txt.txt"
);

});

// DOWNLOAD DOCX
$("#downloadDocBtn").click(async function(){

if(formattedContent.length === 0){

alert(
"No extracted text available."
);

return;

}

try{

const {
Document,
Packer,
Paragraph,
TextRun
} = window.docx;

let docChildren = [];

let currentRuns = [];

for(const item of formattedContent){

// PAGE HEADING
if(item.type === "heading"){

if(currentRuns.length > 0){

docChildren.push(

new Paragraph({

spacing:{
line:320,
after:120
},

children:currentRuns

})

);

currentRuns = [];

}

docChildren.push(

new Paragraph({

spacing:{
after:300
},

children:[

new TextRun({

text:item.text,

bold:true,

size:34,

font:"Arial"

})

]

})

);

}

// NEW LINE
else if(item.type === "newline"){

docChildren.push(

new Paragraph({

spacing:{
line:320,
after:120
},

children:currentRuns

})

);

currentRuns = [];

}

// TEXT
else if(item.type === "text"){

currentRuns.push(

new TextRun({

text:item.text + " ",

bold:item.bold === true,

size: Math.max(
item.size * 2,
18
),

font:item.font,

break:0

})

);

}

}

if(currentRuns.length > 0){

docChildren.push(

new Paragraph({

spacing:{
line:320,
after:120
},

children:currentRuns

})

);

}

const doc =
new Document({

sections:[

{

properties:{},

children:docChildren

}

]

});

const blob =
await Packer.toBlob(doc);

saveAs(
blob,
originalFileName + "_doc.docx"
);

}catch(error){

console.error(error);

alert(
"DOCX generation failed."
);

}

});

</script>

</body>
</html>
