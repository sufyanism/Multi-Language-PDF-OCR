<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Language PDF OCR</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:950px;
background:#1e293b;
padding:30px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:34px;
}

.upload-box{
border:2px dashed #475569;
padding:40px;
border-radius:14px;
background:#111827;
text-align:center;
margin-bottom:20px;
}

input,button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

input{
background:#0f172a;
color:white;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
}

textarea{
width:100%;
height:350px;
margin-top:20px;
padding:15px;
background:#0f172a;
color:white;
border:none;
border-radius:12px;
resize:none;
font-size:16px;
line-height:1.8;
unicode-bidi:plaintext;
direction:auto;
}

.status{
margin-top:15px;
text-align:center;
color:#93c5fd;
}

.progress{
width:100%;
height:14px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.progress-bar{
width:0%;
height:100%;
background:#22c55e;
transition:0.3s;
}
</style>
</head>

<body>

<div class="container">

<h1> Multi-Language PDF OCR</h1>

<div class="upload-box">
<p>Upload scanned PDF</p>
<input type="file" id="pdfFile" accept="application/pdf">
</div>

<button id="extractBtn">
Extract Original Text From All Pages
</button>

<div class="status" id="status"></div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<textarea id="outputText"
placeholder="Extracted text will appear here..."></textarea>

<button id="downloadBtn">
Download TXT File
</button>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let extractedText = "";

$("#extractBtn").click(async function(){

const file = $("#pdfFile")[0].files[0];

if(!file){
alert("Please upload PDF file.");
return;
}

$("#status").text("Loading PDF...");
$("#progressBar").css("width","0%");

extractedText = "";
$("#outputText").val("");

const reader = new FileReader();

reader.onload = async function(){

const typedarray = new Uint8Array(this.result);

const pdf = await pdfjsLib.getDocument(typedarray).promise;

const totalPages = pdf.numPages;

// Multiple languages together
const languagePack = "eng+urd+ara+hin";

for(let pageNum = 1; pageNum <= totalPages; pageNum++){

$("#status").text(
"Extracting page " + pageNum + " of " + totalPages
);

const page = await pdf.getPage(pageNum);

const viewport = page.getViewport({scale:2});

const canvas = document.createElement("canvas");
const context = canvas.getContext("2d");

canvas.width = viewport.width;
canvas.height = viewport.height;

await page.render({
canvasContext:context,
viewport:viewport
}).promise;

const imageData = canvas.toDataURL("image/png");

const result = await Tesseract.recognize(
imageData,
languagePack,
{
logger:m=>{

if(m.status === "recognizing text"){

const progress =
((pageNum - 1) / totalPages) * 100 +
((m.progress * 100) / totalPages);

$("#progressBar").css(
"width",
progress + "%"
);

}

}
}
);

// Original text remains unchanged
extractedText +=
"\n\n========== PAGE " + pageNum + " ==========";

extractedText += "\n\n";

extractedText += result.data.text;

$("#outputText").val(extractedText);

}

$("#status").text(
"All pages extracted successfully."
);

$("#progressBar").css("width","100%");

};

reader.readAsArrayBuffer(file);

});

$("#downloadBtn").click(function(){

if(!extractedText){
alert("No extracted text available.");
return;
}

const blob = new Blob(
[extractedText],
{
type:"text/plain;charset=utf-8"
}
);

saveAs(blob,"mixed-language-ocr.txt");

});

</script>

</body>
</html>
